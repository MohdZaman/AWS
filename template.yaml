
AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  Self-Healing-Infra

  SAM Template for Self-Healing Infrastructure Agent

Globals:
  Function:
    Timeout: 3
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ============================================================
  # 1. FAILURE SOURCE
  # ============================================================

  SelfHealingFaultyLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/faulty-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 10
      AutoPublishAlias: live

  DisableTestLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/disable-test-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 10

  MemoryTestLambda:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/memory-test-lambda/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 30


  # ============================================================
  # 2. FAILURE DETECTION - CLOUDWATCH ALARM
  # ============================================================

  SelfHealingFaultyLambdaAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SelfHealing-FaultyLambda-Alarm
      Namespace: AWS/Lambda
      MetricName: Errors

      Dimensions:
        - Name: FunctionName
          Value: !Ref SelfHealingFaultyLambda

      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching


  # ============================================================
  # 3. DIAGNOSIS - ZAMAN
  # ============================================================

  DiagnoseWithBedrockFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/zaman/diagnose-with-bedrock/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetFunctionConfiguration
              Resource: "*"

            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:DescribeContinuousBackups
              Resource: "*"

            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"


  # ============================================================
  # 4. FIX - JYOTISH
  # ============================================================

  ApplyFixFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/apply-fix/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:

            # ----------------------------------------------------
            # Lambda fix actions
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - lambda:GetAlias
                - lambda:ListVersionsByFunction
                - lambda:UpdateAlias
                - lambda:UpdateFunctionConfiguration
                - lambda:PutFunctionConcurrency
                - lambda:DeleteFunctionConcurrency
                - lambda:GetFunctionConfiguration
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:*"

            # ----------------------------------------------------
            # EC2 read-only
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
              Resource: "*"

            # ----------------------------------------------------
            # EC2 remediation
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - ec2:RebootInstances
                - ec2:StopInstances
                - ec2:StartInstances
                - ec2:ModifyInstanceAttribute
              Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

            # ----------------------------------------------------
            # EC2 rollback AMI: launch replacement
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - ec2:RunInstances
              Resource:
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                - !Sub "arn:aws:ec2:${AWS::Region}::image/*"
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*"
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*"
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:key-pair/*"

            # ----------------------------------------------------
            # EC2 rollback AMI: subnet / security group
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - ec2:RunInstances
              Resource:
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/*"
                - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*"
              Condition:
                StringEquals:
                  "ec2:Vpc": "*"

            # ----------------------------------------------------
            # EC2 replacement: tag after launch
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - ec2:CreateTags
              Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

            # ----------------------------------------------------
            # EC2: pass instance role
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: "*"
              Condition:
                StringEquals:
                  "iam:PassedToService": "ec2.amazonaws.com"

            # ----------------------------------------------------
            # DynamoDB fix actions
            # ----------------------------------------------------
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:DescribeContinuousBackups
                - dynamodb:UpdateTable
                - dynamodb:UpdateContinuousBackups
                - dynamodb:RestoreTableToPointInTime
                - dynamodb:DeleteItem
              Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"


  # ============================================================
  # 5. INCIDENT CHAT - JYOTISH
  # ============================================================

  AskAboutIncidentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/jyotish/ask-about-incidents/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30


  # ============================================================
  # 6. HUMAN APPROVAL HANDLER
  # ============================================================

  ApprovalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/kushal/approval-handler/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Policies:
        - Version: "2012-10-17"
          Statement:

            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"


  # ============================================================
  # 7. INCIDENT DATA
  # ============================================================

  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SelfHealingIncidents
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: incidentId
          AttributeType: S

      KeySchema:
        - AttributeName: incidentId
          KeyType: HASH


  # ============================================================
  # 8. EVENTBRIDGE
  # ============================================================

  # ------------------------------------------------------------
  # Existing CloudWatch Alarm → Step Functions trigger
  # ------------------------------------------------------------

  SelfHealingTrigger:
    Type: AWS::Events::Rule

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      Name: SelfHealingTrigger

      Description: >
        Triggers self-healing workflow when infrastructure
        metrics breach thresholds

      EventBusName: default
      State: ENABLED

      EventPattern:
        source:
          - aws.cloudwatch

        detail-type:
          - CloudWatch Alarm State Change

        detail:
          state:
            value:
              - ALARM

      Targets:
        - Id: Iddfa1de24-3c4b-4c13-9a04-cdeb9f222556

          Arn: arn:aws:states:ap-south-1:691588646018:stateMachine:Self-Healing-Orchestrator

          RoleArn: arn:aws:iam::691588646018:role/service-role/Amazon_EventBridge_Invoke_Step_Functions_1487815626


  # ------------------------------------------------------------
  # EC2 State Change → Step Functions trigger
  # ------------------------------------------------------------

  SelfHealingEC2StateChange:
    Type: AWS::Events::Rule

    Properties:
      Name: SelfHealingEC2StateChange

      Description: >
        Detects EC2 instance running and stopped state changes
        for the self-healing workflow

      EventBusName: default

      State: ENABLED

      EventPattern:
        source:
          - aws.ec2

        detail-type:
          - EC2 Instance State-change Notification

        detail:
          state:
            - running
            - stopped

      Targets:
        - Id: SelfHealingOrchestratorEC2

          Arn: arn:aws:states:ap-south-1:691588646018:stateMachine:Self-Healing-Orchestrator

          RoleArn: arn:aws:iam::691588646018:role/service-role/Amazon_EventBridge_Invoke_Step_Functions_1487815626


  # ============================================================
  # 9. STEP FUNCTIONS ORCHESTRATOR
  # ============================================================

  SelfHealingOrchestrator:
    Type: AWS::Serverless::StateMachine

    Properties:
      Name: Self-Healing-Orchestrator

      DefinitionUri: statemachine/orchestrator.asl.json

      DefinitionSubstitutions:

        DiagnoseFunctionArn: !GetAtt DiagnoseWithBedrockFunction.Arn

        FaultyLambdaArn: !GetAtt SelfHealingFaultyLambda.Arn

        ApprovalFunctionArn: !GetAtt ApprovalFunction.Arn

        ApplyFixFunctionArn: !GetAtt ApplyFixFunction.Arn

      Policies:

        - LambdaInvokePolicy:
            FunctionName: !Ref DiagnoseWithBedrockFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref ApprovalFunction

        - LambdaInvokePolicy:
            FunctionName: !Ref ApplyFixFunction

        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

        - Statement:
            - Effect: Allow
              Action:
                - cloudwatch:DescribeAlarms
              Resource: "*"


  # ============================================================
  # 10. AUTHENTICATION - COGNITO USER POOL
  # ============================================================

  SelfHealingUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: SelfHealingOperators

      AutoVerifiedAttributes:
        - email

      UsernameAttributes:
        - email


  # ============================================================
  # 11. COGNITO SPA APP CLIENT
  # ============================================================

  SelfHealingUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref SelfHealingUserPool

      ClientName: SelfHealingDashboardSPA

      GenerateSecret: false

      AllowedOAuthFlows:
        - code

      AllowedOAuthScopes:
        - openid
        - email
        - profile

      AllowedOAuthFlowsUserPoolClient: true

      CallbackURLs:
        - http://localhost:5173/

      LogoutURLs:
        - http://localhost:5173/


  # ============================================================
  # 12. COGNITO HOSTED UI DOMAIN
  # ============================================================

  SelfHealingCognitoDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      UserPoolId: !Ref SelfHealingUserPool

      Domain: !Sub "self-healing-${AWS::AccountId}"


  # ============================================================
  # 13. FRONTEND APPROVAL API LAMBDA
  # ============================================================

  ApprovalApiFunction:
    Type: AWS::Serverless::Function

    Properties:
      CodeUri: self-healing-azizul/self-healing-azizul/functions/azizul/approval-api/
      Handler: index.handler
      Runtime: nodejs24.x
      Architectures:
        - x86_64
      Timeout: 30

      Environment:
        Variables:
          INCIDENT_TABLE: !Ref IncidentsTable
          ALLOW_ORIGIN: http://localhost:5173

      Policies:
        - Version: "2012-10-17"
          Statement:

            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: !GetAtt IncidentsTable.Arn

            - Effect: Allow
              Action:
                - states:SendTaskSuccess
                - states:SendTaskFailure
              Resource: "*"


 